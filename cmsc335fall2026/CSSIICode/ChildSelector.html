<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Child Selectors</title>

    <style>
        p {
            color: blue;
        }

        div > p {
            color: red;
        }
    </style>

<body>
    <h1>Child Selectors</h1>
    <p>
            Paragraph (in body)
    </p>
    
    <div>
        <p>
            Paragraph in div (child of div)
        </p>

        <p>
            Paragraph in div (child of div)
        </p>
    </div>
    <div>
        <section>
            <p>
                Paragraph in section that is in div (not a child of div)
            </p>
        </section>
    </div>
</body>

</html>
